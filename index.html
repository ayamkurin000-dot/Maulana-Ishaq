<script>
// =====================================================================
// DATA SILSILAH - garis lurus (linear), tanpa autocollapse:
// selalu tampil penuh saat halaman dibuka, tidak butuh buka/tutup shape.
// =====================================================================
const treeData = {
    "name": "NABI MUHAMMAD SAW",
    "type": "root",
    "spouseName": "Khadijah binti Khuwailid radhiyallahu 'anha",
    "children": [
        { "name": "SITI FATIMAH", "type": "gen1", "spouseName": "Ali bin Abi Thalib radhiyallahu 'anh", "children": [
            { "name": "SAYYIDINA HUSAIN", "type": "gen2", "spouseName": "Syahrbanu / Syah-e Zanan", "children": [
                { "name": "ZAINAL ALIM", "type": "gen3", "children": [
                    { "name": "ZAINAL QUBRO", "type": "gen4", "children": [
                        { "name": "ZAINAL HUSAIN", "type": "gen5", "children": [
                            { "name": "SYEKH JUMADIL QUBRO", "type": "gen6", "children": [] }
                        ] }
                    ] }
                ] }
            ] }
        ] }
    ]
};

// ===== ATURAN SHAPE (dipertahankan dari model Bani Isbadar) =====
// - cardWidth tetap, cardHeight FLEKSIBEL mengikuti jumlah baris teks (1/2/3 baris dst).
// - Setiap shape selalu digambar dengan titik sambung di TENGAH ATAS dan TENGAH BAWAH,
//   sehingga garis penghubung antar shape selalu rata meskipun tinggi shape berbeda.
// - Jarak antar shape (panjang garis penghubung) dibuat pendek & rapat.
const cardWidth = 260;
const founderWidth = 260;
const lineHeight = 26;
const padY = 18;
const gapBetween = 18; // jarak pendek antar shape (panjang garis penghubung), dibuat lebih rapat

// ===== Ukuran NUB BATERAI dibuat SERAGAM untuk semua shape =====
// Dipatok mengikuti ukuran nub pada shape standar (SITI FATIMAH, tinggi=56),
// supaya nub tidak lagi ikut membesar/mengecil sesuai tinggi masing-masing shape.
const NUB_BASE_W = 8, NUB_BASE_H = 56 * 0.68, NUB_W = 16, NUB_H = 56 * 0.46;

// ===== Rantai utama SITI FATIMAH s/d SYEKH JUMADIL QUBRO (gen1-gen6):
// disatukan jadi SATU warna saja, gradasi hijau gelap ala lambang NU
// (Nahdlatul Ulama). =====
const NU_GREEN = { light:'#ffffff', mid:'#bbf7d0', mid2:'#86efac', dark:'#ffffff' };
// ===== Rantai leluhur Dewi Sekardadu / garis Majapahit (RAJA MAJAPAHIT
// BRAWIJAYA I s/d MINAK SEMBUYU): gradasi merah putih. =====
const MAJAPAHIT_RED_WHITE = { light:'#b91c1c', mid:'#dc2626', mid2:'#fca5a5', dark:'#ffffff' };

const GEN_COLORS = {
    root:  { light:'#fef3c7', mid:'#fde68a', mid2:'#fbbf24', dark:'#f59e0b' },
    gen1:  NU_GREEN,
    gen2:  NU_GREEN,
    gen3:  NU_GREEN,
    gen4:  NU_GREEN,
    gen5:  NU_GREEN,
    gen6:  NU_GREEN,
    gen7:  { light:'#fff7ed', mid:'#fed7aa', mid2:'#fdba74', dark:'#fb923c' },
    gen8:  { light:'#f0fdfa', mid:'#99f6e4', mid2:'#5eead4', dark:'#2dd4bf' },
    gen9:  { light:'#faf5ff', mid:'#e9d5ff', mid2:'#d8b4fe', dark:'#c084fc' },
    gen10: { light:'#fff1f2', mid:'#fecdd3', mid2:'#fda4af', dark:'#fb7185' },
    gen11: { light:'#fef9c3', mid:'#fde047', mid2:'#facc15', dark:'#eab308' },
    gen12: { light:'#e0f2fe', mid:'#7dd3fc', mid2:'#38bdf8', dark:'#0ea5e9' },
    ancestor: MAJAPAHIT_RED_WHITE,
    // warna khusus shape gabungan besar jalur Mataram (Pangeran Wirosobo -> Amangkurat III)
    mataram: { light:'#fefce8', mid:'#fde68a', mid2:'#fbbf24', dark:'#b45309' }
};

function flattenChain(node, list) {
    list.push(node);
    if (node.children && node.children.length) flattenChain(node.children[0], list);
    return list;
}
const chain = flattenChain(treeData, []);

// bungkus teks nama jadi beberapa baris pendek supaya shape tetap rapi
function wrapName(name, maxCharsPerLine) {
    const words = name.split(' ');
    const lines = [];
    let cur = '';
    words.forEach(w => {
        const test = cur ? cur + ' ' + w : w;
        if (test.length > maxCharsPerLine && cur) {
            lines.push(cur);
            cur = w;
        } else {
            cur = test;
        }
    });
    if (cur) lines.push(cur);
    return lines;
}

// =====================================================================
// AUTO-FIT TEKS: semua shape dibatasi MAKSIMAL 2 BARIS.
// - Jika muat 1 baris di ukuran huruf standar -> pakai 1 baris (ukuran huruf standar, seperti kondisi semula).
// - Jika tidak muat 1 baris -> pecah jadi 2 baris, ukuran huruf TETAP standar.
// - Jika 2 baris pun masih tidak cukup (kata terlalu panjang) -> paksa tetap 2 baris,
//   ukuran huruf diperkecil bertahap (auto-fit) sampai muat. Teks tetap center tengah atas-bawah.
// =====================================================================
const FONT_FAMILY = "'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');
function textWidth(text, fontSize, weight) {
    measureCtx.font = `${weight} ${fontSize}px ${FONT_FAMILY}`;
    return measureCtx.measureText(text).width;
}
// cari titik pecah 2 baris terbaik (paling seimbang) dari sebuah nama
function bestTwoLineSplit(words, fontSize, weight) {
    if (words.length === 1) {
        return { lines: [words[0]], maxW: textWidth(words[0], fontSize, weight) };
    }
    let best = null;
    for (let i = 1; i < words.length; i++) {
        const l1 = words.slice(0, i).join(' ');
        const l2 = words.slice(i).join(' ');
        const w1 = textWidth(l1, fontSize, weight);
        const w2 = textWidth(l2, fontSize, weight);
        const maxW = Math.max(w1, w2);
        if (!best || maxW < best.maxW) best = { lines: [l1, l2], maxW };
    }
    return best;
}
function fitNameToBox(name, maxWidth, baseFontSize, weight) {
    const minFontSize = 9;
    const upperName = name.toUpperCase();
    const words = upperName.trim().split(/\s+/);

    // 1) coba 1 baris di ukuran huruf standar (kondisi saat ini)
    if (textWidth(upperName, baseFontSize, weight) <= maxWidth) {
        return { lines: [upperName], fontSize: baseFontSize };
    }
    // 2) coba 2 baris, ukuran huruf tetap standar
    if (words.length > 1) {
        const split = bestTwoLineSplit(words, baseFontSize, weight);
        if (split.maxW <= maxWidth) return { lines: split.lines, fontSize: baseFontSize };
    }
    // 3) paksa 2 baris: kecilkan ukuran huruf bertahap sampai muat
    let size = baseFontSize;
    while (size > minFontSize) {
        size -= 0.5;
        if (words.length === 1) {
            if (textWidth(upperName, size, weight) <= maxWidth) return { lines: [upperName], fontSize: size };
        } else {
            const split = bestTwoLineSplit(words, size, weight);
            if (split.maxW <= maxWidth) return { lines: split.lines, fontSize: size };
        }
    }
    // 4) fallback di ukuran huruf minimum, tetap dipaksa 2 baris
    if (words.length === 1) return { lines: [upperName], fontSize: minFontSize };
    const split = bestTwoLineSplit(words, minFontSize, weight);
    return { lines: split.lines, fontSize: minFontSize };
}
// jarak antar baris KHUSUS untuk nama panjang yang terpaksa 2 baris (dibuat lebih rapat dari lineHeight).
// Ini hanya berlaku antar baris dari SATU nama yang sama; jarak antara 2 nama berbeda (suami & isteri
// dalam 1 shape gabungan) tetap memakai pemisahan bagian (topH/bottomH + garis pemisah) seperti biasa.
const NAME_LINE_HEIGHT = 16;

// ===== Tinggi shape SYEKH MAULANA ISHAQ dijadikan acuan ukuran seragam =====
// Dihitung dengan rumus & data yang SAMA dengan shape gabungan Maulana Ishaq di bawah
// (nama + pasangan), supaya semua shape lain (kecuali shape Nabi) berukuran sama persis.
const _refNameFit = fitNameToBox("SYEKH MAULANA ISHAQ", cardWidth - 24, 15.5, 800);
const _refSpouseFit = fitNameToBox("DEWI SEKARDADU / DEWI SEKARDALU / SAYU ATIKAH / DEWI KASIHAN", cardWidth - 24, 14, 800);
const _refTopH = _refNameFit.lines.length * NAME_LINE_HEIGHT + 4;
const _refBottomH = _refSpouseFit.lines.length * NAME_LINE_HEIGHT + 4;
// tinggi shape Nabi Muhammad SAW TETAP seperti semula (dikecualikan dari penyeragaman)
const ROOT_H = 2 * lineHeight + padY;
// tinggi seragam utk semua shape lain (chain gen1-gen6 & keturunan gen7), disamakan dgn shape Maulana Ishaq
const STANDARD_H = _refTopH + _refBottomH;

function shapeBodyPath(w, h, rRight, rLeft) {
    return `M ${rLeft},${-h/2} L ${w-rRight},${-h/2} Q ${w},${-h/2} ${w},${-h/2+rRight} ` +
        `L ${w},${h/2-rRight} Q ${w},${h/2} ${w-rRight},${h/2} ` +
        `L ${rLeft},${h/2} Q 0,${h/2} 0,${h/2-rLeft} ` +
        `L 0,${-h/2+rLeft} Q 0,${-h/2} ${rLeft},${-h/2} Z`;
}

const svgNS = "http://www.w3.org/2000/svg";
function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
}

const container = document.getElementById('chart-container');

// hitung info tiap shape: tinggi SERAGAM (cukup utk 2 baris), teks di-auto-fit max 2 baris
const nodesInfo = chain.map((n, idx) => {
    const isRoot = idx === 0;
    const w = isRoot ? founderWidth : cardWidth;
    const baseFontSize = isRoot ? 16 : 13.5;
    const weight = isRoot ? 800 : 700;
    const fit = fitNameToBox(n.name, w - 24, baseFontSize, weight);
    let h = isRoot ? ROOT_H : STANDARD_H;
    let spouseLines = null, spouseFontSize = null, topH = null, bottomH = null;
    if (n.spouseName) {
        const spouseFit = fitNameToBox(n.spouseName, w - 24, 12.5, 700);
        // GAP dipakai seragam utk 4 jarak: atas-box↔nama, nama↔garis, garis↔isteri, isteri↔bawah-box
        // supaya semua teks "rata atas bawah" & jarak ke garis pembatas SAMA persis di kedua sisi.
        const GAP = padY / 2;
        const nameH = fit.lines.length * NAME_LINE_HEIGHT;
        const spouseH = spouseFit.lines.length * NAME_LINE_HEIGHT;
        topH = GAP + nameH + GAP;
        bottomH = GAP + spouseH + GAP;
        h = topH + bottomH;
        spouseLines = spouseFit.lines;
        spouseFontSize = spouseFit.fontSize;
    }
    return { data: n, idx, w, h, lines: fit.lines, fontSize: fit.fontSize, weight, isRoot, spouseLines, spouseFontSize, topH, bottomH };
});

// bangun defs gradient sekali per generasi yang dipakai
function buildDefs(svg) {
    const defs = el('defs', {});
    Object.entries(GEN_COLORS).forEach(([key, c]) => {
        const lg = el('linearGradient', { id: 'grad-'+key, x1:'0%', y1:'0%', x2:'0%', y2:'100%' });
        [[ '0%', c.light ], ['22%', c.mid], ['58%', c.mid2], ['88%', c.dark], ['100%', c.dark]]
            .forEach(([off, col]) => lg.appendChild(el('stop', { offset: off, 'stop-color': col })));
        defs.appendChild(lg);

        const gloss = el('linearGradient', { id: 'gloss-'+key, x1:'0%', y1:'0%', x2:'0%', y2:'100%' });
        gloss.appendChild(el('stop', { offset:'0%', 'stop-color':'#ffffff', 'stop-opacity':0.85 }));
        gloss.appendChild(el('stop', { offset:'32%', 'stop-color':'#ffffff', 'stop-opacity':0.28 }));
        gloss.appendChild(el('stop', { offset:'68%', 'stop-color':'#ffffff', 'stop-opacity':0 }));
        defs.appendChild(gloss);
    });
    const metalBase = el('linearGradient', { id:'grad-metal-base', x1:'0%', y1:'0%', x2:'100%', y2:'0%' });
    [['0%','#475569'],['20%','#94a3b8'],['45%','#e2e8f0'],['70%','#94a3b8'],['100%','#334155']]
        .forEach(([off,col]) => metalBase.appendChild(el('stop', { offset: off, 'stop-color': col })));
    defs.appendChild(metalBase);

    const metalNub = el('linearGradient', { id:'grad-metal-nub', x1:'0%', y1:'0%', x2:'100%', y2:'0%' });
    [['0%','#334155'],['25%','#94a3b8'],['50%','#e2e8f0'],['75%','#94a3b8'],['100%','#1e293b']]
        .forEach(([off,col]) => metalNub.appendChild(el('stop', { offset: off, 'stop-color': col })));
    defs.appendChild(metalNub);

    svg.appendChild(defs);
}

function drawBatteryShape(g, w, h, type) {
    const r = Math.min(22, Math.round(h*0.42));
    const rLeft = Math.max(2, Math.round(r*0.15));
    const nubBaseW = NUB_BASE_W, nubBaseH = NUB_BASE_H, nubW = NUB_W, nubH = NUB_H;

    g.appendChild(el('path', {
        transform: 'translate(1.5,2)', d: shapeBodyPath(w,h,r,rLeft), fill:'#000', opacity:0.09
    }));
    g.appendChild(el('path', {
        class:'real-body', d: shapeBodyPath(w,h,r,rLeft), fill:`url(#grad-${type})`,
        stroke:'#1e293b', 'stroke-width':0.9, 'stroke-opacity':0.18
    }));
    g.appendChild(el('rect', {
        x: r*0.6, y: -h/2+2.5, width: w-r*1.2, height: h*0.36, rx: r*0.5,
        fill:`url(#gloss-${type})`, 'pointer-events':'none'
    }));
    g.appendChild(el('rect', {
        x: w, y: -nubBaseH/2, width: nubBaseW, height: nubBaseH, rx:2.2,
        fill:'url(#grad-metal-base)', stroke:'#64748b', 'stroke-width':0.6
    }));
    const nubG = el('g', { transform:`translate(${w+nubBaseW},0)` });
    nubG.appendChild(el('rect', { x:0, y:-nubH/2, width:nubW, height:nubH, rx:5, fill:'url(#grad-metal-nub)', stroke:'#334155', 'stroke-width':0.7 }));
    nubG.appendChild(el('rect', { x:2, y:-nubH/2+2, width:nubW-4, height:nubH*0.38, rx:2, fill:'#ffffff', opacity:0.55, 'pointer-events':'none' }));
    g.appendChild(nubG);
}

function renderChain() {
    container.innerHTML = '';
    nodesInfo.forEach((info, i) => {
        const block = document.createElement('div');
        block.className = 'node-block';
        if (i === 0) block.id = 'node-nabi-muhammad';

        if (i > 0) {
            const line = document.createElement('div');
            line.className = 'connector';
            line.style.height = gapBetween + 'px';
            block.appendChild(line);
        }

        const svg = el('svg', { width: info.w + 26, height: info.h + 6, viewBox: `0 0 ${info.w+26} ${info.h+6}` });
        buildDefs(svg);
        const g = el('g', { class:'node-shape', transform:`translate(0, ${info.h/2+2})` });
        const type = info.isRoot ? 'root' : (info.data.type in GEN_COLORS ? info.data.type : 'gen1');
        drawBatteryShape(g, info.w, info.h, type);

        const textEl = el('text', {
            x: info.w/2, y: 0, 'text-anchor':'middle', 'dominant-baseline':'middle',
            fill:'#0f172a', 'font-weight': info.weight,
            'font-size': info.fontSize
        });
        if (info.spouseLines) {
            // ===== shape Nabi Muhammad SAW + nama isteri, dipisah garis pembatas
            // di dalam SATU shape yang sama (persis gaya shape gabungan lain). =====
            const hCenterY = -info.h/2 + info.topH/2;
            const hStartY = hCenterY - ((info.lines.length - 1) * NAME_LINE_HEIGHT) / 2;
            info.lines.forEach((ln, li) => {
                const tspan = el('tspan', { x: info.w/2, y: hStartY + li*NAME_LINE_HEIGHT });
                tspan.textContent = ln;
                textEl.appendChild(tspan);
            });
            g.appendChild(textEl);

            g.appendChild(el('line', {
                x1: info.w*0.08, y1: -info.h/2 + info.topH, x2: info.w*0.92, y2: -info.h/2 + info.topH,
                stroke: '#1e293b', 'stroke-width': 1.5, 'stroke-opacity': 0.4, 'stroke-dasharray': '3,3'
            }));

            const spouseTop = -info.h/2 + info.topH;
            const spouseText = el('text', {
                x: info.w/2, y: 0, 'text-anchor':'middle', 'dominant-baseline':'middle',
                fill:'#0f172a', 'font-weight': 700, 'font-size': info.spouseFontSize
            });
            const wCenterY = spouseTop + info.bottomH/2;
            const wStartY = wCenterY - ((info.spouseLines.length - 1) * NAME_LINE_HEIGHT) / 2;
            info.spouseLines.forEach((ln, li) => {
                const tspan = el('tspan', { x: info.w/2, y: wStartY + li*NAME_LINE_HEIGHT });
                tspan.textContent = ln;
                spouseText.appendChild(tspan);
            });
            g.appendChild(spouseText);
        } else {
            const startY = -((info.lines.length - 1) * NAME_LINE_HEIGHT) / 2;
            info.lines.forEach((ln, li) => {
                const tspan = el('tspan', { x: info.w/2, y: startY + li*NAME_LINE_HEIGHT });
                tspan.textContent = ln;
                textEl.appendChild(tspan);
            });
            g.appendChild(textEl);
        }
        svg.appendChild(g);
        block.appendChild(svg);

        // ===== Node terakhir (SYEKH JUMADIL QUBRO) jadi "akar" cabang keturunan =====
        // Tampilan generasi DI ATASNYA (chain Nabi Muhammad SAW s/d node ini) TIDAK diubah sama sekali.
        // Hanya ditambahkan badge (+) yang saat diklik memunculkan keturunannya di SEBELAH KANAN,
        // persis seperti model klik-buka pada silsilah Bani Isbadar.
        if (i === nodesInfo.length - 1) {
            svg.style.cursor = 'pointer';
            const badgeDiv = document.createElement('div');
            badgeDiv.className = 'expand-badge';
            badgeDiv.id = 'desc-badge';
            badgeDiv.title = 'Tampilkan keturunan Syekh Jumadil Qubro';
            badgeDiv.innerHTML = plusIconSVG();
            badgeDiv.addEventListener('click', (e) => { e.stopPropagation(); toggleDescTree(); });
            svg.addEventListener('click', () => toggleDescTree());

            // ----- Hitung titik tengah NUB baterai secara presisi -----
            // Nub digambar drawBatteryShape() di x = w (badan shape) + nubBaseW + nubW,
            // jadi titik tengah horizontal nub = w + nubBaseW + nubW/2 = w + 16.
            // Nub berada di tengah vertikal shape (y=0 relatif terhadap g),
            // dan g diposisikan translate(0, h/2+2) di dalam svg.
            const nubCenterX = info.w + 16;
            const svgTopInBlock = (i > 0 ? gapBetween : 0); // svg didahului garis connector setinggi gapBetween
            const nubCenterY = svgTopInBlock + (info.h / 2 + 2);
            badgeDiv.style.left = (nubCenterX - 13) + 'px';
            badgeDiv.style.top = (nubCenterY - 13) + 'px';

            block.appendChild(badgeDiv);

            const anchorDiv = document.createElement('div');
            anchorDiv.className = 'desc-anchor';
            anchorDiv.id = 'desc-anchor';
            // titik tengah vertikal anchor disamakan persis dengan titik tengah nub baterai
            // (nubCenterY), bukan 50% tinggi blok (yang ikut menghitung garis connector di atas),
            // supaya garis lengkung penghubung ke keturunan benar-benar center terhadap nub.
            anchorDiv.style.top = nubCenterY + 'px';
            block.appendChild(anchorDiv);
        }

        container.appendChild(block);
    });
}

// FIXED BEHAVIOR: jarak antar shape dibuat FIX secara vertikal, dan LEBAR secara horizontal.
// Saat cabang dibuka ke kanan, shape di atas/bawah TIDAK digeser — hanya jarak kanan-kiri
// (stem + stub) yang diperlebar supaya anak punya ruang sendiri.
// FIXED: klik shape berketurunan TIDAK merenggangkan shape atas/bawah.
// Jarak vertikal dibuat FIX (descGapY), jarak horizontal kanan-kiri diperlebar (descStemX + descStubLen)
// supaya cabang punya ruang ke kanan tanpa dorong saudara.
const descGapY = 18;
const descChildWidth = 260;
const descCombinedWidth = 260;
const descStemX = 38;
const descStubLen = 32;

// ===== Registry GLOBAL semua controller cabang (di SELURUH pohon, lintas level) =====
// dipakai supaya saat KUNCI: OFF, membuka cabang baru di mana pun akan menutup
// SEMUA cabang lain yang sedang terbuka, bukan cuma saudara di level yang sama.
const globalOpenControllers = [];
const allSiblingGroups = [];

function plusIconSVG() {
    return `<svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5"/><line x1="5" y1="1" x2="5" y2="9"/></svg>`;
}
function minusIconSVG() {
    return `<svg viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5"/></svg>`;
}

// Hitung ukuran shape tiap anak. Untuk Maulana Ishaq: SATU shape besar gabungan
// suami + isteri, dengan garis pemisah di tengah.
function computeChildDims(nd) {
    if (nd.combined) {
        const nameFit = fitNameToBox(nd.name, descCombinedWidth - 24, 15.5, 800);
        // nama isteri + alias digabung jadi satu teks (dipisah '/'), ukuran huruf SERAGAM (tidak ada lagi teks kecil terpisah)
        const spouseFit = fitNameToBox(nd.spouseName, descCombinedWidth - 24, 14, 800);
        const nameLines = nameFit.lines, spouseLines = spouseFit.lines;
        // padding dirampingkan (tidak lagi dipatok ke tinggi standar 2-baris, cukup mengikuti isi teks)
        const topH = nameLines.length * NAME_LINE_HEIGHT + 4;
        const bottomH = spouseLines.length * NAME_LINE_HEIGHT + 4;
        const h = topH + bottomH;
        return Object.assign({}, nd, {
            w: descCombinedWidth, h, nameLines, spouseLines, topH, bottomH,
            nameFontSize: nameFit.fontSize, spouseFontSize: spouseFit.fontSize
        });
    }
    if (nd.chainList) {
        // SATU shape besar memanjang KE BAWAH berisi seluruh nama jalur keturunan
        // (dipakai untuk data yang HANYA jalur lurus / tidak bercabang, sehingga
        // tidak perlu dipecah jadi banyak shape terpisah dengan garis melengkung).
        const itemFits = nd.items.map(it => fitNameToBox(it, descCombinedWidth - 24, 14, 800));
        const itemHeights = itemFits.map(f => f.lines.length * NAME_LINE_HEIGHT + 14);
        const h = itemHeights.reduce((a, b) => a + b, 0) + 6;
        const boxW = descCombinedWidth;
        let w = boxW, spouseFit = null, spouseBoxW = 0, spouseBoxH = 0;
        // --- opsional: item terakhir punya pasangan, digambar sbg kotak terpisah
        //     di sisi kanan, dihubungkan garis putus + tanda '+' ---
        if (nd.spouseOfLast) {
            spouseBoxW = 190;
            spouseFit = fitNameToBox(nd.spouseOfLast, spouseBoxW - 20, 13, 700);
            spouseBoxH = spouseFit.lines.length * NAME_LINE_HEIGHT + 18;
            w = boxW + 40 + spouseBoxW; // lebar total termasuk konektor & kotak pasangan
        }
        return Object.assign({}, nd, { w, boxW, h, itemFits, itemHeights, spouseFit, spouseBoxW, spouseBoxH });
    }
    const fit = fitNameToBox(nd.name, descChildWidth - 24, 13.5, 700);
    const h = STANDARD_H;
    return Object.assign({}, nd, { w: descChildWidth, h, lines: fit.lines, fontSize: fit.fontSize });
}

// Shape gabungan suami-isteri: satu body besar + garis pemisah horizontal di tengah.
function drawCombinedShape(g, dims) {
    const { w, h, topH, nameLines, spouseLines, aliasLines, bottomH } = dims;
    const r = 20;
    g.appendChild(el('path', { transform: 'translate(1.5,2)', d: shapeBodyPath(w, h, r, r/3), fill:'#000', opacity:0.1 }));
    g.appendChild(el('path', { class:'real-body', d: shapeBodyPath(w, h, r, r/3), fill:`url(#grad-${dims.type})`, stroke:'#1e293b', 'stroke-width':1, 'stroke-opacity':0.22 }));
    g.appendChild(el('rect', { x:r*0.5, y:-h/2+2.5, width:w-r, height:h*0.26, rx:r*0.5, fill:`url(#gloss-${dims.type})`, 'pointer-events':'none' }));

    // --- nub baterai (sama seperti drawBatteryShape, supaya shape gabungan
    //     Maulana Ishaq & Dewi Sekardadu juga punya nub seperti shape lainnya) ---
    const nubBaseW = NUB_BASE_W, nubBaseH = NUB_BASE_H, nubW = NUB_W, nubH = NUB_H;
    g.appendChild(el('rect', {
        x: w, y: -nubBaseH/2, width: nubBaseW, height: nubBaseH, rx:2.2,
        fill:'url(#grad-metal-base)', stroke:'#64748b', 'stroke-width':0.6
    }));
    const nubG = el('g', { transform:`translate(${w+nubBaseW},0)` });
    nubG.appendChild(el('rect', { x:0, y:-nubH/2, width:nubW, height:nubH, rx:5, fill:'url(#grad-metal-nub)', stroke:'#334155', 'stroke-width':0.7 }));
    nubG.appendChild(el('rect', { x:2, y:-nubH/2+2, width:nubW-4, height:nubH*0.38, rx:2, fill:'#ffffff', opacity:0.55, 'pointer-events':'none' }));
    g.appendChild(nubG);

    // --- nama suami (bagian atas) ---
    const husbandText = el('text', { x:w/2, y:0, 'text-anchor':'middle', 'dominant-baseline':'middle', fill:'#0f172a' });
    const hCenterY = -h/2 + topH/2;
    const hStartY = hCenterY - ((nameLines.length - 1) * NAME_LINE_HEIGHT) / 2;
    nameLines.forEach((ln, li) => {
        const tspan = el('tspan', { x:w/2, y: hStartY + li*NAME_LINE_HEIGHT, 'font-weight':800, 'font-size':dims.nameFontSize });
        tspan.textContent = ln;
        husbandText.appendChild(tspan);
    });
    g.appendChild(husbandText);

    // --- garis pemisah suami & isteri ---
    g.appendChild(el('line', { x1:w*0.08, y1:-h/2+topH, x2:w*0.92, y2:-h/2+topH, stroke:'#1e293b', 'stroke-width':1.5, 'stroke-opacity':0.4, 'stroke-dasharray':'3,3' }));

    // --- nama isteri (alias digabung dgn '/'), ukuran huruf seragam, center tengah atas-bawah ---
    const wifeTop = -h/2 + topH;
    const wifeText = el('text', { x:w/2, y:0, 'text-anchor':'middle', 'dominant-baseline':'middle', fill:'#0f172a' });
    const wCenterY = wifeTop + bottomH/2;
    const wStartY = wCenterY - ((spouseLines.length - 1) * NAME_LINE_HEIGHT) / 2;
    spouseLines.forEach((ln, li) => {
        const tspan = el('tspan', { x:w/2, y: wStartY + li*NAME_LINE_HEIGHT, 'font-weight':800, 'font-size':dims.spouseFontSize });
        tspan.textContent = ln;
        wifeText.appendChild(tspan);
    });
    g.appendChild(wifeText);
}

// Shape gabungan BESAR memanjang ke bawah: satu body tunggal berisi berturut-turut
// SEMUA nama pada jalur keturunan (mis. Pangeran Wirosobo -> ... -> Amangkurat III),
// dipisah PANAH KE BAWAH lurus antar nama (bukan garis melengkung terpisah), persis
// seperti diminta: "1 shape besar kebawah, panah kebawah antar nama". Mendukung
// opsional highlight warna pada satu item (mis. item terakhir diberi latar kuning)
// dan opsional kotak PASANGAN terpisah di sisi kanan utk item terakhir.
let chainClipCounter = 0;
function drawChainShape(g, dims) {
    const { h, itemFits, itemHeights, type } = dims;
    const w = dims.boxW || dims.w; // lebar body utama (TIDAK termasuk kotak pasangan)
    const r = 20;
    const clipId = 'chainclip-' + (chainClipCounter++);

    const defs = el('defs', {});
    const clip = el('clipPath', { id: clipId });
    clip.appendChild(el('path', { d: shapeBodyPath(w, h, r, r/3) }));
    defs.appendChild(clip);
    g.appendChild(defs);

    g.appendChild(el('path', { transform: 'translate(1.5,2)', d: shapeBodyPath(w, h, r, r/3), fill:'#000', opacity:0.1 }));
    g.appendChild(el('path', { class:'real-body', d: shapeBodyPath(w, h, r, r/3), fill:`url(#grad-${type})`, stroke:'#1e293b', 'stroke-width':1, 'stroke-opacity':0.22 }));

    // --- highlight khusus utk salah satu item (mis. item terakhir diberi latar kuning),
    //     diclip supaya tetap ikut sudut membulat body ---
    if (typeof dims.highlightIndex === 'number' && dims.highlightIndex >= 0 && dims.highlightIndex < itemHeights.length) {
        let topAcc = -h/2;
        for (let k = 0; k < dims.highlightIndex; k++) topAcc += itemHeights[k];
        const hlH = itemHeights[dims.highlightIndex];
        const hlG = el('g', { 'clip-path': `url(#${clipId})` });
        hlG.appendChild(el('rect', { x:0, y: topAcc, width: w, height: hlH, fill: dims.highlightColor || '#fde047' }));
        g.appendChild(hlG);
    }

    g.appendChild(el('rect', { x:r*0.5, y:-h/2+2.5, width:w-r, height:Math.min(h*0.10, 18), rx:r*0.5, fill:`url(#gloss-${type})`, 'pointer-events':'none' }));

    // --- nub baterai, sama seperti shape lain, di tengah vertikal shape ---
    const nubBaseW = NUB_BASE_W, nubBaseH = NUB_BASE_H, nubW = NUB_W, nubH = NUB_H;
    g.appendChild(el('rect', { x:w, y:-nubBaseH/2, width:nubBaseW, height:nubBaseH, rx:2.2, fill:'url(#grad-metal-base)', stroke:'#64748b', 'stroke-width':0.6 }));
    const nubG = el('g', { transform:`translate(${w+nubBaseW},0)` });
    nubG.appendChild(el('rect', { x:0, y:-nubH/2, width:nubW, height:nubH, rx:5, fill:'url(#grad-metal-nub)', stroke:'#334155', 'stroke-width':0.7 }));
    nubG.appendChild(el('rect', { x:2, y:-nubH/2+2, width:nubW-4, height:nubH*0.38, rx:2, fill:'#ffffff', opacity:0.55, 'pointer-events':'none' }));
    g.appendChild(nubG);

    // --- tulis setiap nama berurutan dari atas ke bawah, PANAH KE BAWAH di antaranya ---
    let cursorTop = -h/2;
    let lastItemCenterY = 0;
    itemFits.forEach((fit, idx) => {
        const secH = itemHeights[idx];
        const cy = cursorTop + secH/2;
        lastItemCenterY = cy;
        const text = el('text', { x:w/2, y:0, 'text-anchor':'middle', 'dominant-baseline':'middle', fill:'#0f172a' });
        const startY = cy - ((fit.lines.length - 1) * NAME_LINE_HEIGHT) / 2;
        fit.lines.forEach((ln, li) => {
            const tspan = el('tspan', { x:w/2, y: startY + li*NAME_LINE_HEIGHT, 'font-weight':800, 'font-size':fit.fontSize });
            tspan.textContent = ln;
            text.appendChild(tspan);
        });
        g.appendChild(text);
        cursorTop += secH;
        if (idx < itemFits.length - 1) {
            // panah kecil menunjuk ke bawah, menandai arah keturunan ke nama berikutnya
            const ah = Math.min(7, secH * 0.26);
            g.appendChild(el('line', {
                x1:w/2, y1:cursorTop - ah, x2:w/2, y2:cursorTop - ah*0.35,
                stroke:'#1e293b', 'stroke-width':1.6, 'stroke-opacity':0.75
            }));
            g.appendChild(el('polygon', {
                points: `${w/2-4},${cursorTop-ah*0.35} ${w/2+4},${cursorTop-ah*0.35} ${w/2},${cursorTop+ah*0.6}`,
                fill: '#1e293b', 'fill-opacity':0.75
            }));
        }
    });

    // --- opsional: pasangan (spouse) utk item terakhir -> garis putus + tanda '+'
    //     + kotak terpisah berisi nama pasangan, di sisi kanan sejajar item terakhir ---
    if (dims.spouseFit) {
        const gapConn = 40;
        const spX = w + gapConn;
        const midY = lastItemCenterY;

        g.appendChild(el('line', { x1:w, y1:midY, x2:spX, y2:midY, stroke:'#1e293b', 'stroke-width':1.6, 'stroke-dasharray':'4,3' }));

        const plusSize = 5, plusX = w + gapConn/2;
        g.appendChild(el('line', { x1:plusX-plusSize, y1:midY, x2:plusX+plusSize, y2:midY, stroke:'#1e293b', 'stroke-width':1.8 }));
        g.appendChild(el('line', { x1:plusX, y1:midY-plusSize, x2:plusX, y2:midY+plusSize, stroke:'#1e293b', 'stroke-width':1.8 }));

        const spW = dims.spouseBoxW, spH = dims.spouseBoxH;
        const spY = midY - spH/2;
        // dibungkus dalam <g> ber-ID supaya bisa dijadikan titik acuan (anchor)
        // untuk menyambungkan rantai keturunan (childChain) di bawahnya.
        const spouseG = el('g', {});
        if (dims.spouseAnchorId) spouseG.id = dims.spouseAnchorId;
        spouseG.appendChild(el('rect', { x:spX, y:spY, width:spW, height:spH, rx:10, fill:'#ffffff', stroke:'#1e293b', 'stroke-width':1.4 }));
        const spText = el('text', { x: spX+spW/2, y: midY, 'text-anchor':'middle', 'dominant-baseline':'middle', fill:'#0f172a' });
        const spLines = dims.spouseFit.lines;
        const spStartY = midY - ((spLines.length-1)*NAME_LINE_HEIGHT)/2;
        spLines.forEach((ln, li) => {
            const tspan = el('tspan', { x: spX+spW/2, y: spStartY+li*NAME_LINE_HEIGHT, 'font-weight':700, 'font-size':dims.spouseFit.fontSize });
            tspan.textContent = ln;
            spText.appendChild(tspan);
        });
        spouseG.appendChild(spText);
        g.appendChild(spouseG);
    }
}

// =====================================================================
// RANTAI KETURUNAN yang MENEMPEL di bawah sebuah kotak pasangan (spouse box)
// milik shape chainList, mis. keturunan RATU IBU/SYARIFAH AMBAMI + RADEN
// PRASENO/CAKRANINGRAT I MADURA -> PANGERAN CAKRANINGRAT I s/d VII.
// Setiap nama digambar sbg KOTAK TERPISAH (bukan 1 shape gabungan), disambung
// panah hitam ke bawah antar kotak, sesuai contoh acuan yang diberikan.
// Dibangun sbg elemen HTML biasa (persis gaya rantai leluhur Dewi Sekardadu)
// supaya otomatis ikut geser/zoom bersama container, lalu diposisikan tepat
// di bawah anchor (kotak pasangan) memakai getBoundingClientRect.
// =====================================================================
function buildAttachedDescendantChain(anchorEl, names, visibilityHost) {
    if (!anchorEl || !names || !names.length) return;
    const boxWidth = 210;

    const wrap = document.createElement('div');
    wrap.style.position = 'absolute';
    wrap.style.zIndex = 3;
    wrap.style.display = 'flex';
    wrap.style.flexDirection = 'column';
    wrap.style.alignItems = 'center';
    container.appendChild(wrap);

    names.forEach((name, i) => {
        if (i > 0) {
            const arrow = document.createElement('div');
            arrow.textContent = '\u2193';
            arrow.style.cssText = 'font-size:15px;font-weight:900;color:#1e293b;line-height:1;margin:3px 0;';
            wrap.appendChild(arrow);
        }
        const box = document.createElement('div');
        box.textContent = name;
        box.style.cssText = `width:${boxWidth}px;box-sizing:border-box;padding:8px 10px;text-align:center;` +
            'background:linear-gradient(180deg,#ffffff 0%,#f1f2f4 55%,#dcdee1 100%);' +
            'border:1.5px solid #334155;border-radius:5px;' +
            'font-size:12px;font-weight:700;color:#0f172a;text-transform:uppercase;line-height:1.3;' +
            'box-shadow:0 2px 5px rgba(0,0,0,0.18);';
        wrap.appendChild(box);
    });

    const ovId = 'chain-link-' + (anchorEl.id || 'x');

    function position() {
        // ===== jika cabang induk (visibilityHost) sedang TERTUTUP, jangan hitung
        // posisi (getBoundingClientRect anchorEl akan bernilai 0 / tidak valid
        // saat display:none) — cukup pastikan rantai ini juga ikut tersembunyi. =====
        if (visibilityHost && !visibilityHost.classList.contains('open')) {
            wrap.style.display = 'none';
            const ov = document.getElementById(ovId);
            if (ov) ov.style.display = 'none';
            return;
        }
        wrap.style.display = 'flex';

        const containerRect = container.getBoundingClientRect();
        const anchorRect = anchorEl.getBoundingClientRect();
        const scale = (tState && tState.k) || 1;

        const anchorLocalX = (anchorRect.left + anchorRect.width / 2 - containerRect.left) / scale;
        const anchorLocalBottomY = (anchorRect.top + anchorRect.height - containerRect.top) / scale;
        const gap = 24;
        const wrapW = wrap.offsetWidth;

        wrap.style.left = (anchorLocalX - wrapW / 2) + 'px';
        wrap.style.top = (anchorLocalBottomY + gap) + 'px';

        let overlay = document.getElementById(ovId);
        if (overlay) overlay.remove();
        overlay = el('svg', { id: ovId, width: 22, height: gap + 4, viewBox: `0 0 22 ${gap + 4}` });
        overlay.style.position = 'absolute';
        overlay.style.left = (anchorLocalX - 11) + 'px';
        overlay.style.top = anchorLocalBottomY + 'px';
        overlay.style.zIndex = 3;
        overlay.appendChild(el('line', { x1:11, y1:0, x2:11, y2:gap - 7, stroke:'#1e293b', 'stroke-width':2.2 }));
        overlay.appendChild(el('polygon', { points:`5,${gap-7} 17,${gap-7} 11,${gap+3}`, fill:'#1e293b' }));
        container.appendChild(overlay);
    }

    setTimeout(position, 380);
    window.addEventListener('resize', () => setTimeout(position, 60));

    // ===== ikat visibilitas rantai ini ke status buka/tutup cabang induknya:
    // begitu cabang induk ditutup (auto-collapse maupun manual), rantai ini
    // otomatis ikut hilang, dan muncul lagi begitu cabang induk dibuka lagi. =====
    if (visibilityHost) {
        const syncVisibility = () => setTimeout(position, 30);
        const mo = new MutationObserver(syncVisibility);
        mo.observe(visibilityHost, { attributes: true, attributeFilter: ['class'] });
    }
}

function drawLeafShape(g, dims) {
    drawBatteryShape(g, dims.w, dims.h, dims.type);
    const textEl = el('text', { x: dims.w/2, y:0, 'text-anchor':'middle', 'dominant-baseline':'middle', fill:'#0f172a', 'font-weight':700, 'font-size':dims.fontSize });
    const startY = -((dims.lines.length - 1) * NAME_LINE_HEIGHT) / 2;
    dims.lines.forEach((ln, li) => {
        const tspan = el('tspan', { x: dims.w/2, y: startY + li*NAME_LINE_HEIGHT });
        tspan.textContent = ln;
        textEl.appendChild(tspan);
    });
    g.appendChild(textEl);
}

// fungsi kurva bezier horizontal, PERSIS model "diagonal()" di silsilah Bani Isbadar:
// melengkung landai dari tepi kanan node induk menuju tepi kiri node anak.
function diagonalCurve(sx, sy, tx, ty) {
    const midX = (sx + tx) / 2;
    return `M ${sx} ${sy} C ${midX} ${sy}, ${midX} ${ty}, ${tx} ${ty}`;
}

// =====================================================================
// RENDER GENERIK satu "kelompok anak" (siblings) ke dalam sebuah hostDiv.
// Dipakai berulang di SETIAP level cabang (bukan cuma sekali di Jumadil Qubro),
// supaya keturunan bisa terus dibuka berjenjang ke kanan: anak -> cucu -> cicit, dst.
// Setiap node yang punya `children` otomatis diberi badge (+/-) sendiri.
// =====================================================================
// onResize (opsional): dipanggil setiap kali TINGGI TOTAL kelompok ini berubah
// (ada cabang di dalamnya dibuka/ditutup), supaya induknya bisa relayout juga.
// Mengembalikan { state, getHeight } — state = controller anak2 di LEVEL INI (utk auto-collapse),
// getHeight = fungsi ambil tinggi total kelompok saat ini (termasuk cabang yg sedang terbuka).
function renderSiblingGroup(nodes, hostDiv, onResize, parentController) {
    const siblingGroupState = [];
    const dims = nodes.map(computeChildDims);
    // tinggi tambahan per-anak saat cabangnya terbuka (0 = tertutup/belum dibuka)
    const openExtra = dims.map(() => 0);

    const svg = el('svg', {});
    buildDefs(svg);
    const g = el('g', { transform: 'translate(0,6)' });
    svg.appendChild(g);
    hostDiv.appendChild(svg);

    const childX = descStemX + descStubLen; // titik kiri tempat shape anak mulai digambar
    const linkEls = [], childGs = [], badgeEls = [], anchorEls = [];

    // FIX: tinggi efektif FIX = tinggi shape itu sendiri, TIDAK ikut cabang yang terbuka.
    // Jadi shape di atas/bawah TIDAK digeser. Ruang diberi dari kanan-kiri (descStemX/descStubLen).
        // FIX: KUNCI ON = auto-geser HANYA di kolom yang sama, kiri tetap
    function effH(i) {
        if (typeof lockOn !== 'undefined' && lockOn) {
            return Math.max(dims[i].h, openExtra[i] || 0);
        }
        return dims[i].h;
    }
    function totalHeight() {
        return dims.reduce((s, d, i) => s + effH(i), 0) + (dims.length - 1) * descGapY;
    }

    // ===== AUTO GESER: hitung ulang posisi semua node & garis penghubung setiap kali
    // ada cabang yang buka/tutup, supaya shape tidak pernah tumpang tindih lagi. =====
    function relayout(shouldPropagate = true) {
        const totalH = totalHeight();
        const maxW = Math.max(...dims.map(d => d.w));
        const svgW = childX + maxW + 30; // +30: ruang utk nub baterai (24px) + margin aman
        const svgH = totalH + 12;
        svg.setAttribute('width', svgW);
        svg.setAttribute('height', svgH);
        svg.setAttribute('viewBox', `0 0 ${svgW} ${svgH}`);

        const centerY = totalH / 2;
        let cursorY = 0;
        dims.forEach((d, i) => {
            const cy = cursorY + effH(i) / 2;
            cursorY += effH(i) + descGapY;

            linkEls[i].setAttribute('d', diagonalCurve(0, centerY, childX, cy));
            childGs[i].setAttribute('transform', `translate(${childX}, ${cy})`);

            if (badgeEls[i]) {
                const nubCenterXinSvg = childX + d.w + 16;
                const nubCenterYinSvg = cy + 6; // +6 mengikuti translate(0,6) pada g
                badgeEls[i].style.left = (nubCenterXinSvg - 13) + 'px';
                badgeEls[i].style.top = (nubCenterYinSvg - 13) + 'px';
                anchorEls[i].style.left = (nubCenterXinSvg + 2) + 'px';
                anchorEls[i].style.top = nubCenterYinSvg + 'px';
            }
        });
        if (shouldPropagate && onResize) onResize();
    }

    dims.forEach((d, i) => {
        const link = el('path', { class: 'desc-link', fill: 'none', stroke: 'rgba(0,0,0,0.55)', 'stroke-width': 1 });
        g.appendChild(link);
        linkEls.push(link);

        const childG = el('g', { class: 'node-shape desc-node' });
        if (d.combined) drawCombinedShape(childG, d);
        else if (d.chainList) drawChainShape(childG, d);
        else drawLeafShape(childG, d);
        if (d.markId) childG.id = d.markId;
        g.appendChild(childG);
        childGs.push(childG);

        // ===== jika chainList ini punya kotak pasangan (spouseOfLast) DAN rantai
        // keturunan lanjutan (childChain), bangun rantai kotak terpisah yang
        // menempel di bawah kotak pasangan tsb, setelah shape benar2 ter-render. =====
        if (d.chainList && d.childChain && d.childChain.length && d.spouseAnchorId) {
            setTimeout(() => {
                buildAttachedDescendantChain(document.getElementById(d.spouseAnchorId), d.childChain, hostDiv);
            }, 400);
        }

        const hasKids = d.children && d.children.length;
        if (hasKids) {
            const badge = document.createElement('div');
            badge.className = 'expand-badge';
            badge.innerHTML = plusIconSVG();
            badge.title = `Tampilkan keturunan ${d.name}`;
            hostDiv.appendChild(badge);
            badgeEls.push(badge);

            const subAnchor = document.createElement('div');
            subAnchor.className = 'desc-anchor';
            hostDiv.appendChild(subAnchor);
            anchorEls.push(subAnchor);

            const toggle = setupExpandable(d, i, badge, subAnchor, openExtra, relayout, siblingGroupState, parentController);
            nodeToggleRegistry.set(nodes[i], toggle);
            childG.style.cursor = 'pointer';
            childG.addEventListener('click', () => toggle());
        } else {
            badgeEls.push(null); anchorEls.push(null);
            childG.addEventListener('click', () => {
                if (d.chainList) {
                    showToast('Jalur keturunan ini sudah lengkap (data tetap, tidak ada percabangan lain).');
                } else {
                    showToast(d.combined
                        ? `Data keturunan ${d.name} & ${d.spouseName} akan menyusul.`
                        : `Data keturunan ${d.name} akan menyusul.`);
                }
            });
        }
    });

    relayout();
    allSiblingGroups.push({ relayout, getHeight: totalHeight });
    return { state: siblingGroupState, getHeight: totalHeight };
}

// Urus buka/tutup satu node yang punya children (lazy-build: kelompok anaknya baru
// dirender saat pertama diklik). Setiap kali buka/tutup, relayoutParent() dipanggil
// supaya seluruh kelompok saudara di level ini otomatis geser mengikuti tinggi cabang
// yang sedang terbuka (auto geser, berlaku sama baik KUNCI ON maupun OFF).
// siblingGroupState: daftar controller SEMUA saudara di level yang sama, dipakai utk auto-collapse.
function setupExpandable(d, index, badge, subAnchor, openExtra, relayoutParent, siblingGroupState, parentController) {
    let built = false, open = false, childCtrl = null;

    function setIcon() {
        badge.innerHTML = open ? minusIconSVG() : plusIconSVG();
        badge.title = open ? `Tutup keturunan ${d.name}` : `Tampilkan keturunan ${d.name}`;
    }

    // menutup cabang ini; kalau collapseInside true, cabang2 DI DALAMNYA yang masih
    // terbuka ikut direset tertutup juga, supaya saat dibuka lagi kondisinya bersih.
    function closeBranch(collapseInside) {
        if (!open) return;
        open = false;
        subAnchor.classList.remove('open');
        setIcon();
        openExtra[index] = 0;
        relayoutParent(false); // kiri tetap
        if (collapseInside && childCtrl) {
            childCtrl.state.forEach(c => c.close(true));
        }
    }

    const controller = { close: closeBranch, isOpen: () => open, parent: parentController };
    siblingGroupState.push(controller);
    globalOpenControllers.push(controller);

    function toggle() {
        if (open) {
            closeBranch(true);
            showToast('Cabang keturunan ditutup.');
            return;
        }
        if (!built) {
            // relayout otomatis tiap kali tinggi cabang anak ini berubah (mis. ada cucu yg dibuka di dalamnya)
            childCtrl = renderSiblingGroup(d.children, subAnchor, () => {
                if (!childCtrl) return; // hindari error saat build awal (childCtrl belum ke-assign)
                openExtra[index] = childCtrl.getHeight();
                relayoutParent(false); // kiri tetap, hanya kolom ini
            }, controller);
            built = true;
        }
        // ===== AUTO-COLLAPSE: kalau KUNCI OFF, SEMUA cabang lain yang sedang
        // terbuka di SELURUH pohon (bukan cuma saudara di level yang sama)
        // otomatis ditutup (beserta cabang di dalamnya) — KECUALI leluhur
        // (ancestor) dari cabang yang baru diklik, supaya cabang ini sendiri
        // tidak ikut hilang gara-gara wadah induknya ditutup. =====
        if (!lockOn) {
            const keepOpen = new Set();
            let p = controller;
            while (p) { keepOpen.add(p); p = p.parent; }
            globalOpenControllers.forEach(c => { if (!keepOpen.has(c) && c.isOpen()) c.close(true); });
        }
        open = true;
        subAnchor.classList.add('open');
        setIcon();
        openExtra[index] = childCtrl.getHeight();
                relayoutParent(false); // kiri tetap, hanya kolom ini // <-- auto geser: dorong saudara lain menjauh sesuai tinggi cabang yg baru dibuka
        showToast(`Menampilkan keturunan ${d.name} di sebelah kanan.`);
    }
    badge.addEventListener('click', (e) => { e.stopPropagation(); toggle(); });
    toggle.isOpen = controller.isOpen;
    return toggle;
}

// Registry: petakan objek data asli (nd) -> fungsi toggle cabangnya, dipakai
// oleh fitur pencarian untuk otomatis MEMBUKA seluruh cabang leluhur dari
// sebuah nama yang ditemukan (persis reaksi "reveal" di silsilah Bani Isbadar),

// Berbeda dari cabang keturunan (yang perlu diklik/buka), rantai leluhur
// ini SELALU TAMPIL begitu file dibuka, lalu disambungkan dengan garis
// lengkung ke shape SYEKH MAULANA ISHAQ & DEWI SEKARDADU (bagian isteri).

    // leluhur + nama akhir "DEWI SEKARDADU", dipisahkan tanda panah hitam

    function addArrow() {

            'text-transform:uppercase;';

    const finalName = document.createElement('div');
    finalName.textContent = 'DEWI SEKARDADU';
    finalName.style.cssText = 'font-size:15px;font-weight:800;color:#000000;line-height:1.3;' +
        'text-transform:uppercase;';
    wrap.appendChild(finalName);

    const finalCaption = document.createElement('div');
    finalCaption.textContent = '(Isteri Syekh Maulana Ishaq)';
    finalCaption.style.cssText = 'font-size:11px;font-weight:700;font-style:italic;color:#000000;' +
        'line-height:1.3;margin-top:4px;';
    wrap.appendChild(finalCaption);

    // ===== posisikan wrap di ATAS shape "SYEKH MAULANA IBRAHIM ASMORO QONDI",
    // sejajar tengah (center) secara horizontal dengan kotak tersebut dan
    // hanya berjarak tipis (mepet) di atasnya -- lalu tetap disambungkan
    // dengan garis lengkung menuju shape Syekh Maulana Ishaq & Dewi
    // Sekardadu. =====
    function positionAndConnect() {
        const containerRect = container.getBoundingClientRect();
        const targetRect = targetEl.getBoundingClientRect();
        const ibrahimEl = document.getElementById('node-ibrahim-asmoro-qondi');
        const ibrahimRect = ibrahimEl ? ibrahimEl.getBoundingClientRect() : targetRect;
        const scale = (tState && tState.k) || 1;

        const targetLocalX = (targetRect.left - containerRect.left) / scale;
        const targetLocalY = (targetRect.top + targetRect.height / 2 - containerRect.top) / scale;
        const targetW = targetRect.width / scale;
        const targetH = targetRect.height / scale;
        // titik sambung sekarang di TENGAH BAWAH shape Syekh Maulana Ishaq
        // (bukan sisi kiri), supaya mata panah tidak tertutup/menabrak shape.
        const targetBottomX = targetLocalX + targetW / 2;
        const targetBottomY = targetLocalY + targetH / 2;
        const wrapW = wrap.offsetWidth;
        const wrapH = wrap.offsetHeight;

        const ibrahimLocalX = (ibrahimRect.left - containerRect.left) / scale;
        const ibrahimLocalTop = (ibrahimRect.top - containerRect.top) / scale;
        const ibrahimW = ibrahimRect.width / scale;
        const gapFromChain = 14; // hampir mepet dgn shape Syekh Maulana Ibrahim Asmoro Qondi
        // center horizontal wrap terhadap kotak Syekh Maulana Ibrahim Asmoro Qondi
        const leftPx = ibrahimLocalX + (ibrahimW / 2) - (wrapW / 2);
        const topPx = ibrahimLocalTop - wrapH - gapFromChain;

        wrap.style.left = leftPx + 'px';
        wrap.style.top = topPx + 'px';

        // garis penghubung ke kotak Syekh Maulana Ishaq dihapus atas permintaan
        let overlay = document.getElementById('ancestor-link-overlay');
        if (overlay) overlay.remove();
    }

    // tunggu transisi buka anchor (0.25s) selesai supaya ukuran/posisi terukur akurat
    setTimeout(positionAndConnect, 350);
    window.addEventListener('resize', () => setTimeout(positionAndConnect, 60));
}

// =====================================================================
// GESER (drag) & ZOOM (scroll mouse / pinch) — rule SAMA dengan silsilah
// Bani Isbadar: skala 0.2x s/d 2x, drag untuk geser, scroll/pinch untuk
// zoom in-out. Ditulis native JS (tanpa library luar) supaya selalu jalan.
// =====================================================================
const wrapEl = document.getElementById('chart-wrap');
const contEl = document.getElementById('chart-container');
const SCALE_MIN = 0.2, SCALE_MAX = 2;
let tState = { x: 0, y: 0, k: 1 };

function applyTransform() {
    contEl.style.transform = `translate(${tState.x}px, ${tState.y}px) scale(${tState.k})`;
}

function centeredTransform(k) {
    const scale = k || 1;
    const tx = (wrapEl.clientWidth - contEl.offsetWidth * scale) / 2;
    const ty = Math.max(90, (wrapEl.clientHeight - contEl.offsetHeight * scale) / 2);
    return { x: tx, y: ty, k: scale };
}

function centerChart(animate) {
    const t = centeredTransform(1);
    if (animate) {
        contEl.style.transition = 'transform 0.5s ease';
        setTimeout(() => { contEl.style.transition = ''; }, 520);
    }
    tState = t;
    applyTransform();
}

// ----- Drag (mouse) untuk geser -----
let isDragging = false, dragStartX = 0, dragStartY = 0, startTx = 0, startTy = 0, movedWhileDown = false;
wrapEl.addEventListener('mousedown', (e) => {
    if (e.target.closest('.expand-badge')) return; // biar tombol +/- tetap bisa diklik
    isDragging = true; movedWhileDown = false;
    wrapEl.classList.add('grabbing');
    dragStartX = e.clientX; dragStartY = e.clientY;
    startTx = tState.x; startTy = tState.y;
});
window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if (Math.abs(dx) > 2 || Math.abs(dy) > 2) movedWhileDown = true;
    tState.x = startTx + dx;
    tState.y = startTy + dy;
    applyTransform();
});
window.addEventListener('mouseup', () => {
    isDragging = false;
    wrapEl.classList.remove('grabbing');
});

// ----- Touch (geser 1 jari, pinch 2 jari untuk zoom) -----
let touchStartDist = null, touchStartScale = 1, touchStartTx = 0, touchStartTy = 0;
function touchDist(t1, t2) { return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY); }
wrapEl.addEventListener('touchstart', (e) => {
    if (e.target.closest('.expand-badge')) return;
    if (e.touches.length === 1) {
        isDragging = true;
        dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
        startTx = tState.x; startTy = tState.y;
    } else if (e.touches.length === 2) {
        isDragging = false;
        touchStartDist = touchDist(e.touches[0], e.touches[1]);
        touchStartScale = tState.k;
        touchStartTx = tState.x; touchStartTy = tState.y;
    }
}, { passive: true });
wrapEl.addEventListener('touchmove', (e) => {
    if (e.touches.length === 1 && isDragging) {
        tState.x = startTx + (e.touches[0].clientX - dragStartX);
        tState.y = startTy + (e.touches[0].clientY - dragStartY);
        applyTransform();
    } else if (e.touches.length === 2 && touchStartDist) {
        const newDist = touchDist(e.touches[0], e.touches[1]);
        let k = touchStartScale * (newDist / touchStartDist);
        k = Math.min(SCALE_MAX, Math.max(SCALE_MIN, k));
        tState.k = k; tState.x = touchStartTx; tState.y = touchStartTy;
        applyTransform();
    }
}, { passive: true });
wrapEl.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) { isDragging = false; touchStartDist = null; }
}, { passive: true });

// ----- Scroll mouse untuk zoom in/out (zoom terpusat di posisi kursor) -----
wrapEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const factor = Math.exp(-e.deltaY * 0.0015);
    const newK = Math.min(SCALE_MAX, Math.max(SCALE_MIN, tState.k * factor));
    const rect = wrapEl.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const wx = (mx - tState.x) / tState.k, wy = (my - tState.y) / tState.k;
    tState.x = mx - wx * newK;
    tState.y = my - wy * newK;
    tState.k = newK;
    applyTransform();
}, { passive: false });

centerChart(false);
window.addEventListener('resize', () => centerChart(false));

// ===== FITUR PENCARIAN NAMA - 1 BARIS SAJA, HANYA NAMA =====
let allNamesCache = null;
function collectAllNames() {
    if (allNamesCache) return allNamesCache;
    const set = new Map();
    function walk(nodes) {
        nodes.forEach(n => {
            if (n.name) {
                const key = n.name.toUpperCase().trim();
                if (!set.has(key)) set.set(key, {name: n.name.toUpperCase()});
            }
            if (n.spouseName) {
                n.spouseName.split('/').forEach(s => {
                    const sTrim = s.trim().toUpperCase();
                    if (sTrim && !set.has(sTrim)) set.set(sTrim, {name: sTrim});
                });
            }
            if (n.items) {
                n.items.forEach(it => {
                    const key = it.toUpperCase().trim();
                    if (!set.has(key)) set.set(key, {name: key});
                });
            }
            if (n.children) walk(n.children);
        });
    }
    try {
        if (typeof descChildren !== 'undefined') walk(descChildren);
        if (typeof ancestorChainData !== 'undefined') walk(ancestorChainData);
        if (typeof chain !== 'undefined') walk(chain);
    } catch(e) {}
    allNamesCache = Array.from(set.values());
    return allNamesCache;
}

function updateDropdown(query, filtered) {
    const dd = document.getElementById('search-dropdown');

        dd.classList.remove('show');

    ).join('');

// ketik di kotak pencarian HANYA menampilkan daftar saran (dropdown), TIDAK
// menyentuh shape di chart sama sekali — persis model Bani Isbadar. Reaksi
// pada chart (buka cabang, kamera pindah, shape berkedip) baru terjadi saat
// SATU nama benar-benar dipilih (klik saran / lewat selectSuggestion).
function searchNames(q, fromSuggestion=false) {
    const query = (q || '').trim();
    if (fromSuggestion) {
        hideDropdown();
        selectFoundName(query);
        return;
    }
    const dd = document.getElementById('search-dropdown');
    if (!query) {
        if (dd) { dd.classList.remove('show'); dd.innerHTML = ''; }
        return;
    }
    if (query.length < 3) {
        if (dd) { dd.classList.remove('show'); dd.innerHTML = ''; }
        return;
    }
    const queryUpper = query.toUpperCase();
    const allNames = collectAllNames();
    const filtered = allNames.filter(item => item.name.includes(queryUpper));
    updateDropdown(query, filtered);
}

// ===== Cari path (rantai leluhur) menuju sebuah nama di dalam data ASLI
// descChildren (bukan hasil render), lalu buka satu-per-satu cabang di
// sepanjang path itu — persis fungsi revealNode() di silsilah Bani Isbadar. =====
function findDescPath(nodes, targetUpper, path) {
    for (const nd of nodes) {
        const curPath = path.concat([nd]);
        const nameU = (nd.name || '').toUpperCase().trim();
        const spouseMatch = nd.spouseName && nd.spouseName.toUpperCase().includes(targetUpper);
        const itemMatch = nd.items && nd.items.some(it => it.toUpperCase().includes(targetUpper));
        if (nameU === targetUpper || spouseMatch || itemMatch) return curPath;
        if (nd.children && nd.children.length) {
            const sub = findDescPath(nd.children, targetUpper, curPath);
            if (sub) return sub;
        }
    }
    return null;
}

function revealName(targetUpper) {
    if (typeof descChildren === 'undefined') return false;
    const path = findDescPath(descChildren, targetUpper, []);
    if (!path) return false;
    let openedSomething = false;
    for (let i = 0; i < path.length - 1; i++) {
        const toggleFn = nodeToggleRegistry.get(path[i]);
        if (toggleFn && !toggleFn.isOpen()) {
            toggleFn();
            openedSomething = true;
        }
    }
    return openedSomething;
}

// ===== Pindahkan "kamera" (geser & tetap di skala saat ini) supaya shape
// yang ditemukan tepat di tengah layar, dengan transisi halus — versi native
// (translate/scale CSS) dari centerOnNode() milik silsilah Bani Isbadar. =====
function centerOnElement(el, duration) {
    duration = duration === undefined ? 700 : duration;
    const wrapRect = wrapEl.getBoundingClientRect();
    const elRect = el.getBoundingClientRect();
    const headerOffset = 70;
    const curCenterX = elRect.left + elRect.width / 2;
    const curCenterY = elRect.top + elRect.height / 2;
    const desiredX = wrapRect.left + wrapRect.width / 2;
    const desiredY = wrapRect.top + headerOffset + (wrapRect.height - headerOffset) / 2;
    tState.x += (desiredX - curCenterX);
    tState.y += (desiredY - curCenterY);
    contEl.style.transition = `transform ${duration}ms ease`;
    applyTransform();
    setTimeout(() => { contEl.style.transition = ''; }, duration + 30);
}

function clearFoundHighlight() {
    document.querySelectorAll('.node-shape.search-highlight').forEach(elm => {
        elm.classList.remove('search-highlight');
        elm.querySelectorAll('.search-highlight-overlay').forEach(o => o.remove());
    });
}

// ===== Reaksi shape saat nama ditemukan: garis tepi + cahaya amber berkedip
// 2x lalu hilang sendiri — PERSIS highlightFoundNode() di Bani Isbadar. =====
function highlightFoundElements(elements) {
    elements.forEach(elm => {
        elm.classList.add('search-highlight');
        try {
            const bbox = elm.getBBox();
            const pad = 6;
            const r = Math.min(22, Math.round(bbox.height * 0.42)) + 3;
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('class', 'search-highlight-overlay');
            rect.setAttribute('x', bbox.x - pad);
            rect.setAttribute('y', bbox.y - pad);
            rect.setAttribute('width', bbox.width + pad * 2);
            rect.setAttribute('height', bbox.height + pad * 2);
            rect.setAttribute('rx', r);
            rect.setAttribute('ry', r);
            elm.appendChild(rect);
        } catch (e) { /* elemen belum terukur, lewati overlay saja */ }
        setTimeout(() => {
            elm.classList.remove('search-highlight');
            elm.querySelectorAll('.search-highlight-overlay').forEach(o => o.remove());
        }, 2700);
    });
}

// ===== Alur lengkap: nama dipilih -> buka cabang leluhurnya kalau perlu ->
// kamera geser halus ke shape-nya -> shape berkedip disorot amber.
// Persis alur selectSearchResult() di silsilah Bani Isbadar. =====
function selectFoundName(name) {
    const target = (name || '').trim();
    if (!target) return;
    clearFoundHighlight();
    const targetUpper = target.toUpperCase();

    function doFind() {
        const matches = [];
        document.querySelectorAll('.node-shape').forEach(shape => {
            const tspans = shape.querySelectorAll('tspan');
            const text = Array.from(tspans).map(t => t.textContent).join(' ').toUpperCase();
            if (text.includes(targetUpper)) matches.push(shape);
        });
        if (matches.length === 0) {
            showToast(`TIDAK DITEMUKAN "${target}"`);
            return;
        }
        const primary = matches[0];
        centerOnElement(primary, 700);
        setTimeout(() => highlightFoundElements([primary]), 60);
        showToast(`DITEMUKAN: ${target.toUpperCase()}`);
    }

    const revealed = revealName(targetUpper);
    if (revealed) {
        setTimeout(doFind, 320);
    } else {
        doFind();
    }
}

document.addEventListener('click', function(e) {
    const wrap = document.getElementById('search-wrap');
    const dd = document.getElementById('search-dropdown');
    if (wrap && dd && !wrap.contains(e.target)) {
        dd.classList.remove('show');
    }
});

document.getElementById('search-input').addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    const dd = document.getElementById('search-dropdown');
    const first = dd ? dd.querySelector('.search-suggest-item') : null;
    if (first) {
        selectSuggestion(first.textContent);
    } else {
        selectFoundName(this.value);
    }
});

// ===== Toast notifikasi kecil =====
let toastTimer = null;
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
